name: CD

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "configs/**"
      - "docker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cd.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t fraud-detection-api:${{ github.sha }} .
          docker tag fraud-detection-api:${{ github.sha }} fraud-detection-api:latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/fraud-detection-api
          docker tag fraud-detection-api:latest $IMAGE:${{ github.sha }}
          docker tag fraud-detection-api:latest $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
