[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "1.0.0"
description = "End-to-End MLOps Pipeline for Fraud Detection"
requires-python = ">=3.11"
dependencies = [
    # Below 3: evidently 0.7 imports pandas internals that pandas 3 removed
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    # Registry stages are deprecated and will be removed in a future major version
    "mlflow>=3.0,<4",
    "prefect>=3.9,<4",
    "pandera>=0.24",
    "imbalanced-learn>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    # 0.7 introduced the Report and evidently.presets API used in src/monitoring/drift.py
    "evidently>=0.7,<0.8",
    "prometheus-fastapi-instrumentator>=6.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ruff>=0.3",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
